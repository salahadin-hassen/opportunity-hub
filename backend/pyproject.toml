[project]
name = "opportunity-hub"
version = "0.1.0"
description = "Personalized opportunity discovery platform - Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121.0",  # Depends(scope="function"): commit before the response is sent
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0,<2.1.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.1.0",
    # [crypto] adds `cryptography`: RS256 verification of Google ID tokens (app.services.google_oauth).
    "pyjwt[crypto]>=2.8.0",
    "argon2-cffi>=23.1.0",
    # The ingestion fetcher (app.intelligence.fetcher) runs in production; pinned in constraints.txt.
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
