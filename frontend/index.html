<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Opportunity Hub checks your profile against the published eligibility rules of scholarships, internships and fellowships, and shows the evidence behind every verdict." />
    <meta name="theme-color" content="#F5F2E9" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply a remembered dark theme before first paint so there is no light flash.
      try {
        if (localStorage.getItem("oh.theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#12151B");
        }
      } catch (error) {}
    </script>
    <title>Opportunity Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
