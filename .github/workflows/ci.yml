# Continuous integration for Opportunity Hub (plan task M1-T1).
#
# Three independent jobs, each with its own throwaway PostgreSQL 16 container:
#   backend-tests  the full pytest suite against a dedicated *_test database
#   migrations     alembic check, plus an upgrade -> downgrade base -> upgrade round trip
#   frontend       npm ci, type check, unit tests, production build
#
# Nothing here deploys, and no secrets are used: every database URL points at the
# job's own service container on localhost with a CI-only password.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/opportunity-hub-product
      # Branches no Render service tracks: CI runs here without any deployment.
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Render pins 3.12.7 and pyproject.toml requires >= 3.11; Render builds the frontend with Node 22.
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PG_USER: ohub_ci
  PG_PASSWORD: ci-only-not-a-secret

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ohub_ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: opportunity_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ohub_ci -d opportunity_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # tests/conftest.py refuses a TEST_DATABASE_URL whose name lacks a distinct "test" word or that
      # equals DATABASE_URL's database, and then points the app at the test database itself.
      DATABASE_URL: postgresql://ohub_ci:ci-only-not-a-secret@localhost:5432/opportunity_hub_ci
      TEST_DATABASE_URL: postgresql://ohub_ci:ci-only-not-a-secret@localhost:5432/opportunity_hub_test
      APP_ENV: development
      JWT_SECRET: ci-only-jwt-secret-not-used-outside-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 30); do
            docker exec "${{ job.services.postgres.id }}" pg_isready -U "$PG_USER" -d opportunity_hub_test && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1

      - name: Run the backend test suite
        # The session fixture in conftest.py migrates the test database to head before any test runs.
        run: python -m pytest -q

  migrations:
    name: Migration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ohub_ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ohub_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: development
      JWT_SECRET: ci-only-jwt-secret-not-used-outside-tests
      DB_BASE: postgresql://ohub_ci:ci-only-not-a-secret@localhost:5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create two disposable databases
        run: |
          for _ in $(seq 1 30); do
            docker exec "${{ job.services.postgres.id }}" pg_isready -U "$PG_USER" -d postgres && break
            sleep 2
          done
          docker exec "${{ job.services.postgres.id }}" createdb -U "$PG_USER" ci_schema_check
          docker exec "${{ job.services.postgres.id }}" createdb -U "$PG_USER" ci_migration_roundtrip

      - name: "Check A: models and migrations are in sync"
        # alembic/env.py migrates whatever DATABASE_URL names; here that is the empty disposable database.
        env:
          DATABASE_URL: ${{ env.DB_BASE }}/ci_schema_check
        run: |
          alembic upgrade head
          alembic check

      - name: "Check B: upgrade, downgrade to base, upgrade again"
        env:
          DATABASE_URL: ${{ env.DB_BASE }}/ci_migration_roundtrip
        run: |
          heads="$(alembic heads | awk '{print $1}')"
          if [ "$(echo "$heads" | wc -l)" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found: $heads" >&2
            exit 1
          fi
          alembic upgrade head
          alembic downgrade base
          remaining="$(alembic current | awk '{print $1}')"
          if [ -n "$remaining" ]; then
            echo "Downgrade to base left revision $remaining applied" >&2
            exit 1
          fi
          alembic upgrade head
          current="$(alembic current | awk '{print $1}')"
          echo "Expected head: $heads; current: $current"
          [ "$current" = "$heads" ]

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
